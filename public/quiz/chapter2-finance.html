<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>証券アナリスト｜金融経済 問題集</title>
<style>
/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* ===== BASE ===== */
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic Medium', 'Noto Sans JP', sans-serif;
  background: #f5f5f0;
  color: #1a1a1a;
  font-size: 14px;
  line-height: 1.7;
  min-height: 100vh;
}
/* ===== HEADER ===== */
header {
  background: #1a1a2e;
  color: #fff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.header-logo {
  font-size: 11px;
  letter-spacing: 0.12em;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px;
  padding: 3px 10px;
  font-weight: 600;
}
.header-title-wrap {}
.header-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.header-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  margin-top: 1px;
}
.btn-pdf {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.03em;
  transition: background 0.15s;
}
.btn-pdf:hover { background: rgba(255,255,255,0.2); }
/* ===== LAYOUT ===== */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 52px);
}
/* ===== SIDEBAR ===== */
.sidebar {
  background: #fff;
  border-right: 1px solid #e0e0d8;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  padding: 18px 18px 12px;
  border-bottom: 1px solid #ebebeb;
}
.sidebar-header-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #999;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sidebar-count {
  font-size: 13px;
  color: #555;
}
.sidebar-count strong { color: #1a1a2e; }
.sidebar-stats {
  display: flex;
  gap: 8px;
  padding: 12px 18px;
  border-bottom: 1px solid #ebebeb;
}
.stat {
  flex: 1;
  background: #f8f8f5;
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
  border: 1px solid #eee;
}
.stat-n {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
}
.stat-n.c-correct { color: #2e7d32; }
.stat-n.c-wrong   { color: #c62828; }
.stat-n.c-total   { color: #1a1a2e; }
.stat-label { font-size: 10px; color: #999; }
/* Q List */
.q-list-wrap { flex: 1; overflow-y: auto; }
.q-list-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #bbb;
  padding: 12px 18px 6px;
  text-transform: uppercase;
}
.q-list { list-style: none; }
.q-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  cursor: pointer;
  font-size: 12.5px;
  color: #444;
  border-left: 3px solid transparent;
  transition: background 0.1s, border-color 0.1s;
  line-height: 1.4;
}
.q-list li:hover { background: #f5f5f0; }
.q-list li.active {
  background: #eef3fc;
  border-left-color: #1a3c8a;
  color: #1a3c8a;
  font-weight: 600;
}
.q-list li.done-ok { color: #2e7d32; }
.q-list li.done-ng { color: #c62828; }
.q-no {
  font-size: 10px;
  font-weight: 700;
  color: #bbb;
  width: 22px;
  flex-shrink: 0;
  text-align: right;
}
.q-list li.active .q-no { color: #1a3c8a; }
.q-list li.done-ok .q-no { color: #2e7d32; }
.q-list li.done-ng .q-no { color: #c62828; }
.q-label { flex: 1; min-width: 0; }
.q-theme-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-type-badge {
  font-size: 9px;
  border-radius: 3px;
  padding: 1px 5px;
  font-weight: 700;
  flex-shrink: 0;
}
.badge-pc { background: #e8f0fe; color: #1a3c8a; }
.badge-ex { background: #fce8e8; color: #c62828; }
.q-mark {
  font-size: 13px;
  flex-shrink: 0;
  width: 16px;
  text-align: center;
}
/* ===== MAIN ===== */
.main {
  padding: 28px 36px 48px;
  max-width: 820px;
}
/* Progress */
.progress-wrap {
  margin-bottom: 24px;
}
.progress-track {
  height: 4px;
  background: #e0e0d8;
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #1a3c8a;
  border-radius: 2px;
  transition: width 0.4s ease;
}
/* Score summary (shown when all done) */
.score-wrap {
  display: none;
  background: #fff;
  border: 1px solid #e0e0d8;
  border-radius: 12px;
  padding: 22px 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.score-wrap.show { display: block; }
.score-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #1a1a2e; }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.score-item {
  background: #f8f8f5;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.score-big { font-size: 26px; font-weight: 700; }
.score-item.s-total .score-big { color: #1a1a2e; }
.score-item.s-ok    .score-big { color: #2e7d32; }
.score-item.s-pct   .score-big { color: #1a3c8a; }
.score-lbl { font-size: 11px; color: #999; margin-top: 3px; }
/* Question card */
.q-card {
  background: #fff;
  border: 1px solid #e0e0d8;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom: 16px;
}
.q-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: #f8f8f5;
  border-bottom: 1px solid #ebebeb;
}
.q-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  background: #1a1a2e;
  color: #fff;
  padding: 4px 12px;
  border-radius: 20px;
}
.q-card-theme {
  font-size: 12px;
  font-weight: 600;
  background: #eef3fc;
  color: #1a3c8a;
  padding: 4px 12px;
  border-radius: 20px;
}
.q-card-type {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
}
.type-pc { background: #e8f0fe; color: #1a3c8a; }
.type-ex { background: #fce8e8; color: #c62828; }
.q-card-body { padding: 22px 22px 18px; }
/* Question text */
.q-text {
  font-size: 14px;
  line-height: 1.85;
  margin-bottom: 4px;
}
.q-stem-block {
  background: #f5f7ff;
  border-left: 4px solid #7090cc;
  border-radius: 0 8px 8px 0;
  padding: 14px 18px;
  margin: 14px 0;
  font-size: 13.5px;
  line-height: 1.9;
}
.q-sub-text {
  font-size: 13.5px;
  line-height: 1.85;
  margin-bottom: 4px;
}
.q-sub-item {
  font-size: 13.5px;
  line-height: 1.85;
  margin-left: 1em;
  text-indent: -1em;
  padding-left: 1em;
}
/* 穴埋め問題の下線 */
.blank { display: inline-block; min-width: 60px; border-bottom: 2px solid #333; }
/* 択一式選択肢 */
.choices { list-style: none; margin-top: 18px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid #e0e0d8;
  border-radius: 8px;
  margin-bottom: 9px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  font-size: 13.5px;
  line-height: 1.6;
}
.choice:hover:not(.disabled) {
  border-color: #1a3c8a;
  background: #eef3fc;
}
.choice.sel {
  border-color: #1a3c8a;
  background: #eef3fc;
}
.choice.ok {
  border-color: #2e7d32;
  background: #e8f5e9;
}
.choice.ng {
  border-color: #c62828;
  background: #ffebee;
}
.choice.disabled { cursor: default; }
.choice-label {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid #ccc;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.12s;
  background: #fff;
}
.choice.sel .choice-label { background: #1a3c8a; border-color: #1a3c8a; color: #fff; }
.choice.ok  .choice-label { background: #2e7d32; border-color: #2e7d32; color: #fff; }
.choice.ng  .choice-label { background: #c62828; border-color: #c62828; color: #fff; }
/* 記述式問題 */
.essay-area {
  margin-top: 16px;
  background: #f8f8f5;
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 13px;
  color: #666;
  border: 1px dashed #ccc;
  line-height: 1.7;
}
/* Actions */
.q-actions {
  padding: 0 22px 22px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.btn-submit {
  background: #1a1a2e;
  color: #fff;
  border: none;
  padding: 10px 28px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.03em;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-submit:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-submit:not(:disabled):hover { opacity: 0.82; transform: translateY(-1px); }
.btn-retry {
  background: transparent;
  color: #666;
  border: 1.5px solid #ccc;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-retry:hover { background: #f5f5f0; }
/* Result */
.result-box {
  display: none;
  margin: 0 22px 16px;
  border-radius: 10px;
  padding: 16px 20px;
}
.result-box.show { display: block; }
.result-box.ok-box {
  background: #e8f5e9;
  border: 1.5px solid #a5d6a7;
}
.result-box.ng-box {
  background: #ffebee;
  border: 1.5px solid #ef9a9a;
}
.result-verdict {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}
.result-verdict.ok { color: #2e7d32; }
.result-verdict.ng { color: #c62828; }
.result-text { font-size: 13px; line-height: 1.75; }
/* Explanation card */
.exp-card {
  display: none;
  background: #fff;
  border: 1px solid #e0e0d8;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom: 16px;
}
.exp-card.show { display: block; }
.exp-head {
  background: #1a1a2e;
  color: #fff;
  padding: 14px 20px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.exp-head-icon {
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.exp-body { padding: 22px 22px; }
.exp-section { margin-bottom: 18px; }
.exp-section:last-child { margin-bottom: 0; }
.exp-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #999;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid #ebebeb;
}
.exp-text { font-size: 13.5px; line-height: 1.85; }
/* Explanation components */
.formula-box {
  background: #eef3fc;
  border-left: 4px solid #1a3c8a;
  border-radius: 0 8px 8px 0;
  padding: 12px 18px;
  font-size: 14px;
  text-align: center;
  margin: 12px 0;
  color: #1a3c8a;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.exp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin: 10px 0;
}
.exp-table th {
  background: #f5f5f0;
  padding: 8px 12px;
  text-align: left;
  font-weight: 700;
  border: 1px solid #ddd;
  font-size: 12px;
}
.exp-table td {
  padding: 8px 12px;
  border: 1px solid #e8e8e8;
  line-height: 1.6;
}
.exp-table tr:nth-child(even) td { background: #fafaf8; }
.c-up   { color: #c62828; font-weight: 600; }
.c-down { color: #2e7d32; font-weight: 600; }
.c-ok   { color: #2e7d32; }
.c-ng   { color: #c62828; }
.note-box {
  background: #fff8e1;
  border: 1px solid #ffe082;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.75;
  margin: 10px 0;
}
.note-box strong { color: #e65100; }
.tip-box {
  background: #e0f2f1;
  border: 1px solid #80cbc4;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.75;
  margin: 10px 0;
}
.tip-box strong { color: #00695c; }
.flow-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 16px;
  background: #f5f7ff;
  border-radius: 8px;
  margin: 10px 0;
  border: 1px solid #dde3f5;
}
.flow-node {
  background: #eef3fc;
  border: 1.5px solid #aac0e8;
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 600;
  color: #1a3c8a;
  text-align: center;
  line-height: 1.4;
}
.flow-arr { font-size: 16px; color: #aaa; }
.flow-end {
  background: #e8f5e9;
  border: 1.5px solid #a5d6a7;
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 600;
  color: #2e7d32;
  text-align: center;
}
/* SVG diagrams inside explanations */
.exp-diagram-wrap {
  background: #fafafa;
  border: 1px solid #ebebeb;
  border-radius: 8px;
  padding: 16px;
  margin: 10px 0;
  overflow-x: auto;
}
/* Navigation */
.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 6px;
}
.btn-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 1.5px solid #ddd;
  color: #555;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
}
.btn-nav:hover:not(:disabled) {
  border-color: #1a3c8a;
  color: #1a3c8a;
  background: #eef3fc;
}
.btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-pos { font-size: 13px; color: #999; font-weight: 500; }
@media print {
  .sidebar, header .btn-pdf, .q-actions, .nav-row { display: none !important; }
  .layout { display: block; }
  .main { padding: 0; max-width: 100%; }
  .exp-card { display: block !important; }
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <span class="header-logo">CMA</span>
    <div class="header-title-wrap">
      <div class="header-title">証券アナリスト｜金融経済 問題集</div>
      <div class="header-sub">第Ⅱ章 金融経済 ／ Point Check・章末問題</div>
    </div>
  </div>
  <button class="btn-pdf" onclick="window.print()">🖨 PDF出力</button>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-header-title">問題一覧</div>
    <div class="sidebar-count">全 <strong id="s-total">0</strong> 問 ／ 金融経済</div>
  </div>
  <div class="sidebar-stats">
    <div class="stat">
      <div class="stat-n c-total" id="s-n-total">0</div>
      <div class="stat-label">全問</div>
    </div>
    <div class="stat">
      <div class="stat-n c-correct" id="s-n-ok">0</div>
      <div class="stat-label">正解</div>
    </div>
    <div class="stat">
      <div class="stat-n c-wrong" id="s-n-ng">0</div>
      <div class="stat-label">不正解</div>
    </div>
  </div>
  <div class="q-list-wrap">
    <div class="q-list-label">問題一覧</div>
    <ul class="q-list" id="q-list"></ul>
  </div>
</aside>
<main class="main">
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="score-wrap" id="score-wrap">
    <div class="score-title">🎉 全問完了！</div>
    <div class="score-grid">
      <div class="score-item s-total"><div class="score-big" id="sc-total">0</div><div class="score-lbl">全問題数</div></div>
      <div class="score-item s-ok"><div class="score-big" id="sc-ok">0</div><div class="score-lbl">正解数</div></div>
      <div class="score-item s-pct"><div class="score-big" id="sc-pct">0%</div><div class="score-lbl">正解率</div></div>
    </div>
  </div>
  <div id="q-area"></div>
  <div class="nav-row">
    <button class="btn-nav" id="btn-prev" onclick="go(cur-1)">← 前の問題</button>
    <span class="nav-pos" id="nav-pos">1 / 1</span>
    <button class="btn-nav" id="btn-next" onclick="go(cur+1)">次の問題 →</button>
  </div>
</main>
</div>
<script>
const QS = [
{
  id:'II-1', type:'pc', theme:'金融政策の手段・貨幣乗数',
  qhtml:`<div class="q-text">日本における伝統的な金融政策の手段として、（　①　）操作、（　②　）操作、預金準備率操作、を挙げることができる。現在、日本銀行が民間金融機関に対して貸出を行う際に適用される金利である（　②　）操作は補助的な役割となり、（　①　）操作を使ってインターバンク金利を誘導することが金融政策の中心となっている。また、もともと預金準備率操作は裁量的な金融政策にはあまり使用されてこなかった。</div>
<div class="q-text" style="margin-top:10px;">通貨量の操作において、日本銀行が直接操作できるのは（　③　）の量であり（　③　）を増減させると、それに応じて民間銀行が貸出を増減させることによって（　④　）の量が増減すると考えられている。</div>`,
  isEssay: true,
  answerHtml:`<div class="exp-text">① 公開市場（操作）　② 公定歩合　③ マネタリーベース（ハイパワードマネー）　④ マネーストック</div>`,
  expHtml:`
<div class="exp-section">
  <div class="exp-section-title">金融政策の3つの手段</div>
  <table class="exp-table">
    <tr><th>手段</th><th>内容</th><th>現在の位置づけ</th></tr>
    <tr><td>公開市場操作（買いオペ・売りオペ）</td><td>日銀が市場で国債等の売買を行い、インターバンク金利を誘導</td><td>主たる手段（中心）</td></tr>
    <tr><td>公定歩合操作（現：基準貸付利率）</td><td>日銀が民間銀行に貸出を行う際の金利</td><td>補助的な役割</td></tr>
    <tr><td>預金準備率操作</td><td>民間銀行が日銀に積み立てる準備率の変更</td><td>裁量的政策にはあまり使用されず</td></tr>
  </table>
</div>

{
  id:'II-2', type:'pc', theme:'貨幣乗数の低下（2013年）',

  answerHtml:`<div class="exp-text">貨幣乗数は、マネーストック(M2)をマネタリーベースで除した値と定義されている。2013年度の4月から、日本銀行が質的・量的金融緩和政策を導入することで、マネタリーベースの増加率が大幅に高まった。一方銀行の貸出が、それと比較して低い伸びにとどまった。すなわち、マネタリーベースは、マネーストック(M2)の増加率を上回って増加した。このため、貨幣乗数の値が低下した。</div>`,
  expHtml:`

  <div class="exp-section-title">貨幣乗数とは</div>

</div>
<div class="exp-section">
  <div class="exp-section-title">2013年に貨幣乗数が低下した理由</div>

    <div class="flow-arr">→</div>
    <div class="flow-end">貨幣乗数 ↓</div>
  </div>
  <div class="note-box"><strong>変化率の関係式：</strong><br>ΔM/M ＝ Δm/m ＋ ΔH/H<br>マネタリーベースHの伸び率がマネーストックMの伸び率を上回った場合、貨幣乗数mの伸び率はマイナスとなり、貨幣乗数の値は低下します。</div>
</div>`
},

{

  expHtml:`

{
  id:'II-12', type:'pc', theme:'業績悪化時の株価上昇',
  qhtml:`<div class="q-text">企業業績の悪化が予想され、1株あたりの利益の減少が見込まれているにも関わらず、株式市場において株価が上昇することがある。このような状況が生じる原因として、どのようなことが考えられるか、配当割引モデルを用いて説明しなさい。</div>`,
  isEssay: true,
  answerHtml:`<div class="exp-text">配当割引モデルにおいて割引率は、利子率とリスクプレミアムの合計とされている。企業業績が悪化すると配当が減少し株価は低下する。一方、金融政策が緩和的に運営されると利子率が低下し、割引現在価値合計は増大して株価は上昇する。企業業績が悪化する状況では金融緩和が実施される可能性が高く、金融緩和による株価上昇の効果が業績悪化による株価下落の効果を上回る場合、株価は上昇する。</div>`,
  expHtml:`
<div class="exp-section">
  <div class="exp-section-title">2つの効果の相殺</div>
  <table class="exp-table">
    <tr><th>要因</th><th>方向</th><th>株価への影響</th></tr>
    <tr><td>企業業績悪化 → 予想配当D↓</td><td>株価↓要因</td><td class="c-down">株価 ↓</td></tr>
    <tr><td>金融緩和 → 利子率r↓</td><td>株価↑要因</td><td class="c-up">株価 ↑</td></tr>
  </table>
  <div class="tip-box"><strong>株価が上昇する条件：</strong>金融緩和による利子率低下の効果（分母の減少）が、企業業績悪化による配当減少の効果（分子の減少）を上回る場合、株価は上昇します。</div>
</div>`
},
{
  id:'II-13', type:'pc', theme:'物価上昇と理論株価',
  qhtml:`<div class="q-text">物価上昇率が恒久的に2％ポイント高まり、割引率と配当成長率がともに2％ポイント上昇したとする。配当割引モデルにおける理論株価は変化するか、式を示して説明しなさい。</div>`,
  isEssay: true,
  answerHtml:`<div class="exp-text">株価＝D/(r－g)において、割引率が2%ポイント上昇し、配当成長率も2%ポイント高まると、分母(r－g)の値は変化しない。また分子Dも変化しない。このため、配当割引モデルによる理論株価は、物価上昇前後で変化しない。</div>`,
  expHtml:`
<div class="exp-section">
  <div class="exp-section-title">数値例で確認</div>
  <div class="formula-box">P ＝ D / (r－g)（リスクプレミアムがゼロの場合）</div>
  <table class="exp-table">
    <tr><th></th><th>物価上昇前</th><th>物価上昇後（+2%pt）</th></tr>

    <tr><td>配当成長率 g</td><td>3%</td><td>5%</td></tr>
    <tr><td>r－g（分母）</td><td>2%</td><td>2%（変化なし）</td></tr>
    <tr><td><strong>理論株価 P</strong></td><td>D/0.02</td><td class="c-ok">D/0.02（変化なし）</td></tr>
  </table>
  <div class="tip-box"><strong>直感的な理解：</strong>インフレによって将来配当の名目額は増えますが（成長率g↑）、割り引く率（r）も同じだけ増えます。結果として分母(r－g)は変化せず、株価は変わりません（フィッシャー効果的な考え方）。</div>
</div>`
},

<div class="q-sub-item" style="margin-top:6px;">(2)　予想物価上昇率の上昇による実質金利の変化は、どのような経路を通してGDPに影響を与えるか、2つ挙げて説明しなさい。</div>

  isEssay: true,

  expHtml:`

let cur = 0;
const st = QS.map(() => ({ done: false, ok: false }));

function buildList() {
  const ul = document.getElementById('q-list');
  ul.innerHTML = '';
  const n = QS.length;
  document.getElementById('s-total').textContent = n;
  document.getElementById('s-n-total').textContent = n;
  const nok = st.filter(s=>s.ok).length;
  const nng = st.filter(s=>s.done&&!s.ok).length;
  document.getElementById('s-n-ok').textContent = nok;
  document.getElementById('s-n-ng').textContent = nng;
  QS.forEach((q,i) => {
    const s = st[i];
    const li = document.createElement('li');
    let cls = s.done ? (s.ok?'done-ok':'done-ng') : '';
    if(i===cur) cls += ' active';
    li.className = cls;
    li.onclick = ()=>goQ(i);
    const mark = s.done ? (s.ok?'✓':'✗') : '';
    li.innerHTML = `<span class="q-no">${String(i+1).padStart(2,'0')}</span>
      <span class="q-label"><div class="q-theme-text">${q.id}</div><div class="q-theme-text" style="font-size:11px;color:#888;">${q.theme}</div></span>
      <span class="q-type-badge ${q.type==='pc'?'badge-pc':'badge-ex'}">${q.type==='pc'?'PC':'章末'}</span>
      <span class="q-mark">${mark}</span>`;
    ul.appendChild(li);
  });
  const pct = ((cur+1)/QS.length*100).toFixed(1);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('nav-pos').textContent = `${cur+1} / ${QS.length}`;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===QS.length-1;
  const allDone = st.every(s=>s.done);
  const sw = document.getElementById('score-wrap');
  if(allDone){
    sw.classList.add('show');
    document.getElementById('sc-total').textContent = QS.length;
    document.getElementById('sc-ok').textContent = nok;
    document.getElementById('sc-pct').textContent = Math.round(nok/QS.length*100)+'%';
  } else { sw.classList.remove('show'); }
}

function render() {
  const q = QS[cur];
  const s = st[cur];
  const area = document.getElementById('q-area');
  const typeLabel = q.type==='pc' ? 'Point Check' : '章末問題';
  const typeCls   = q.type==='pc' ? 'type-pc' : 'type-ex';
  let resHtml = '';
  if(s.done) {
    resHtml = `<div class="result-box ok-box show">
      <div class="result-verdict ok">✓　解答例</div>
      <div class="result-text">以下の解答・解説を確認してください</div>
    </div>`;
  }
  const actHtml = `<div class="q-actions">
    ${!s.done ? `<button class="btn-submit" onclick="submitEssay()">解答を確認する</button>` : `<button class="btn-retry" onclick="resetQ()">やり直す</button>`}
  </div>`;
  const expCls = s.done ? 'exp-card show' : 'exp-card';
  area.innerHTML = `
<div class="q-card">
  <div class="q-card-top">
    <span class="q-badge">Question ${String(cur+1).padStart(2,'0')}</span>
    <span class="q-card-theme">${q.theme}</span>
    <span class="q-card-type ${typeCls}">${typeLabel} ${q.id}</span>
  </div>
  <div class="q-card-body">${q.qhtml}</div>
  ${resHtml}
  ${actHtml}
</div>
<div class="${expCls}">
  <div class="exp-head"><div class="exp-head-icon">📖</div>解答・解説</div>
  <div class="exp-body">
    <div class="exp-section">
      <div class="exp-section-title">解答例</div>
      ${q.answerHtml}
    </div>
    ${q.expHtml}
  </div>
</div>`;
  buildList();
}

function submitEssay() {
  st[cur].done = true;
  st[cur].ok = true;
  render();
  setTimeout(()=>{
    const rb = document.querySelector('.result-box.show');
    if(rb) rb.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}

function resetQ() {
  st[cur] = { done:false, ok:false };
  render();
}

function goQ(i) {
  if(i<0||i>=QS.length) return;
  cur = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(i){ goQ(i); }

render();
</script>
</body>
</html>
